services:
  # ==========================================
  # Redpanda - Kafka API Compatible Broker
  # ==========================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:28082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda:28082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "6000:9092"
      - "6001:28082"
      - "6002:9644"
      - "29092:29092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - stock-etl-network
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 5

  # Redpanda Console for monitoring
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.3
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; PORT=6003 /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      PORT: 6003
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
          schemaRegistry:
            enabled: false
        connect:
          enabled: false
    ports:
      - "6003:6003"
    networks:
      - stock-etl-network
    depends_on:
      - redpanda

  # ==========================================
  # Spark Master & Workers
  # ==========================================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: stock-etl-spark:latest
    container_name: spark-master
    profiles: [ "spark" ]
    command: >
      bash -c " /opt/spark/sbin/start-master.sh --host spark-master --port 7077 --webui-port 6004 & sleep 5 && /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --work-dir /opt/spark/tmp && tail -f /opt/spark/logs/*.out "
    environment:
      - SPARK_MASTER_WEBUI_PORT=6004
      - SPARK_UI_PORT=4040
      - SPARK_WORKER_MEMORY=4g # Optimized for 12GB total Docker limit
      - SPARK_WORKER_CORES=6 # Keep cores high for parallelism
      - SPARK_SHUFFLE_SERVICE_ENABLED=false
      - SPARK_LOCAL_DIR=/opt/spark/tmp
      - FORCE_BACKFILL=${FORCE_BACKFILL}
    deploy:
      resources:
        limits:
          memory: 5g # Worker memory (4g) + overhead (1g)
        reservations:
          memory: 4g
    ports:
      - "6004:6004"
      - "6005:7077"
      - "6006:4040"
      - "6011:8081"
    volumes:
      - ./spark:/opt/spark-jobs
      - spark-delta-tables:/opt/spark/delta_tables
      - spark-checkpoints:/opt/spark/checkpoints
      - ./spark/tmp:/opt/spark/tmp
    networks:
      - stock-etl-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6004" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================
  # PostgreSQL for Airflow Metadata
  # ==========================================
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "6007:5432"
    networks:
      - stock-etl-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5

  # ==========================================
  # TimescaleDB for Grafana Data Source
  # PostgreSQL-compatible time-series database
  # ==========================================
  postgres-timescale:
    image: timescale/timescaledb:latest-pg15
    container_name: postgres-timescale
    environment:
      - POSTGRES_USER=${POSTGRES_GRAFANA_USER}
      - POSTGRES_PASSWORD=${POSTGRES_GRAFANA_PASSWORD}
      - POSTGRES_DB=${POSTGRES_GRAFANA_DB}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./scripts/init-timescale.sql:/docker-entrypoint-initdb.d/01-init-timescale.sql
      - ./scripts/init-grafana.sql:/docker-entrypoint-initdb.d/02-init-grafana.sql
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - "6008:5432"
    networks:
      - stock-etl-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U grafana" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb

  # Init container to ensure Grafana database exists
  # Runs after postgres-timescale is healthy
  postgres-timescale-init:
    image: timescale/timescaledb:latest-pg15
    container_name: postgres-timescale-init
    environment:
      - POSTGRES_USER=${POSTGRES_GRAFANA_USER}
      - POSTGRES_PASSWORD=${POSTGRES_GRAFANA_PASSWORD}
      - POSTGRES_DB=${POSTGRES_GRAFANA_DB}
      - PGHOST=postgres-timescale
      - PGPORT=5432
    volumes:
      - ./scripts/ensure-grafana-db.sh:/ensure-grafana-db.sh
    networks:
      - stock-etl-network
    depends_on:
      postgres-timescale:
        condition: service_healthy
    command: [ "/bin/bash", "/ensure-grafana-db.sh" ]
    restart: "no"

  # ==========================================
  # Airflow - Workflow Orchestration
  # ==========================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: custom-airflow:latest
    container_name: airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=${AIRFLOW__CORE__LOAD_EXAMPLES}
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./producer:/opt/airflow/producer
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - stock-etl-network
    depends_on:
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
        echo "Airflow initialization complete"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: custom-airflow:latest
    container_name: airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=${AIRFLOW__CORE__LOAD_EXAMPLES}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - AIRFLOW__API__AUTH_BACKENDS=${AIRFLOW__API__AUTH_BACKENDS}
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=6009
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./producer:/opt/airflow/producer
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "6009:6009"
    networks:
      - stock-etl-network
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    command: webserver
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:6009/health" ]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: custom-airflow:latest
    container_name: airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=${AIRFLOW__CORE__LOAD_EXAMPLES}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./producer:/opt/airflow/producer
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - stock-etl-network
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      cleanup-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g
    command: scheduler
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"' ]
      interval: 10s
      timeout: 10s
      retries: 5

  # ==========================================
  # Cleanup Init - FORCE_BACKFILL Data Cleanup
  # ==========================================
  cleanup-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: cleanup-init
    entrypoint: [ "/bin/bash" ]
    user: root # Run as root to handle volume permissions
    environment:
      - FORCE_BACKFILL=${FORCE_BACKFILL}
      - POSTGRES_GRAFANA_USER=${POSTGRES_GRAFANA_USER}
      - POSTGRES_GRAFANA_PASSWORD=${POSTGRES_GRAFANA_PASSWORD}
    volumes:
      - ./scripts:/scripts
      - ./producer/state:/app/state
      - spark-delta-tables:/opt/spark/delta_tables
      - spark-checkpoints:/opt/spark/checkpoints
      - ./polars_etl/checkpoints:/opt/spark/checkpoints # Mount Polars checkpoints for cleanup
    networks:
      - stock-etl-network
    depends_on:
      redpanda:
        condition: service_healthy # Wait for Redpanda to be healthy
      postgres-timescale:
        condition: service_healthy # Wait for TimescaleDB to be healthy
      postgres-airflow:
        condition: service_healthy # Wait for Airflow DB to be healthy
    command: [ "/scripts/cleanup-on-backfill.sh" ]
    restart: "no"
    profiles: [ "spark", "polars" ]

  # ==========================================
  # Polars ETL - Lightweight Mode
  # ==========================================
  polars-etl:
    build:
      context: ./polars_etl
      dockerfile: Dockerfile
    container_name: polars-etl
    profiles: [ "polars" ]
    environment:
      - REDPANDA_BROKER=redpanda:9092
      - KAFKA_TOPIC_RAW=${KAFKA_TOPIC_RAW}
      - POSTGRES_GRAFANA_DB=${POSTGRES_GRAFANA_DB}
      - POSTGRES_GRAFANA_USER=${POSTGRES_GRAFANA_USER}
      - POSTGRES_GRAFANA_PASSWORD=${POSTGRES_GRAFANA_PASSWORD}
    volumes:
      - spark-delta-tables:/opt/spark/delta_tables
      - ./polars_etl/checkpoints:/opt/spark/checkpoints # Persist checkpoint state
    networks:
      - stock-etl-network
    depends_on:
      redpanda:
        condition: service_healthy
      postgres-timescale:
        condition: service_healthy
      cleanup-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  # ==========================================
  # Producer - Stock Data Ingestion
  # ==========================================
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: stock-producer
    environment:
      - REDPANDA_BROKER=${REDPANDA_BROKER}
      - KAFKA_TOPIC_RAW=${KAFKA_TOPIC_RAW}
      - KAFKA_TOPIC_DLQ=${KAFKA_TOPIC_DLQ}
      - KAFKA_TOPIC_BACKFILL_DLQ=${KAFKA_TOPIC_BACKFILL_DLQ}
      - STOCK_TICKERS=${STOCK_TICKERS}
      - PRODUCER_INTERVAL_SECONDS=${PRODUCER_INTERVAL_SECONDS}
      - PRODUCER_MAX_RETRIES=${PRODUCER_MAX_RETRIES}
      - PRODUCER_RETRY_DELAY=${PRODUCER_RETRY_DELAY}
      - BACKFILL_DAYS=${BACKFILL_DAYS}
      - FORCE_BACKFILL=${FORCE_BACKFILL}
      - TZ=${TZ}
      - WM_PATH=/app/state/watermarks.json
    volumes:
      - ./producer/state:/app/state
      - ./producer/logs:/app/logs
    networks:
      - stock-etl-network
    depends_on:
      cleanup-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # Spark Streaming Jobs - Automated
  # ==========================================
  spark-bronze:
    image: stock-etl-spark:latest
    pull_policy: never
    container_name: spark-bronze-job
    profiles: [ "spark" ]
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - FORCE_BACKFILL=${FORCE_BACKFILL}
    volumes:
      - ./spark:/opt/spark-jobs
      - spark-delta-tables:/opt/spark/delta_tables
      - spark-checkpoints:/opt/spark/checkpoints
    networks:
      - stock-etl-network
    deploy:
      resources:
        limits:
          memory: 2g # Reduced from 4g - Driver (512MB) + overhead
        reservations:
          memory: 1g
    depends_on:
      spark-master:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      cleanup-init:
        condition: service_completed_successfully
    command: [ "/bin/bash", "-c", " echo 'Waiting for Spark master...' && sleep 30 && echo 'Starting Bronze Layer Ingestion...' && /opt/spark/bin/spark-submit --master spark://spark-master:7077 --jars /opt/spark/jars/delta-core_2.12-2.4.0.jar,/opt/spark/jars/delta-storage-2.4.0.jar,/opt/spark/jars/spark-sql-kafka-0-10_2.12-3.4.1.jar,/opt/spark/jars/spark-token-provider-kafka-0-10_2.12-3.4.0.jar,/opt/spark/jars/kafka-clients-3.4.0.jar,/opt/spark/jars/commons-pool2-2.11.1.jar --conf spark.sql.streaming.checkpointLocation.checkpointSchema=true --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=1 --conf spark.dynamicAllocation.maxExecutors=2 --conf spark.dynamicAllocation.initialExecutors=1 --conf spark.dynamicAllocation.executorIdleTimeout=30s --conf spark.executor.cores=2 --conf spark.executor.memory=1g --conf spark.driver.memory=512m --conf spark.driver.cores=1 --conf spark.sql.shuffle.partitions=10 --conf spark.cleaner.periodicGC.enabled=true /opt/spark-jobs/jobs/bronze_ingestion.py " ]
    restart: unless-stopped

  spark-silver:
    image: stock-etl-spark:latest
    pull_policy: never
    container_name: spark-silver-job
    profiles: [ "spark" ]
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark:/opt/spark-jobs
      - spark-delta-tables:/opt/spark/delta_tables
      - spark-checkpoints:/opt/spark/checkpoints
    networks:
      - stock-etl-network
    deploy:
      resources:
        limits:
          memory: 2g # Reduced from 4g - Driver (512MB) + overhead
        reservations:
          memory: 1g
    depends_on:
      spark-bronze:
        condition: service_started
      cleanup-init:
        condition: service_completed_successfully
    command: [ "/bin/bash", "-c", " echo 'Waiting for Bronze layer to initialize...' && sleep 60 && echo 'Starting Silver Layer Cleaning...' && /opt/spark/bin/spark-submit --master spark://spark-master:7077 --jars /opt/spark/jars/delta-core_2.12-2.4.0.jar,/opt/spark/jars/delta-storage-2.4.0.jar,/opt/spark/jars/postgresql-42.6.0.jar --conf spark.sql.streaming.checkpointLocation.checkpointSchema=true --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=1 --conf spark.dynamicAllocation.maxExecutors=2 --conf spark.executor.memory=1g --conf spark.executor.cores=2 --conf spark.driver.memory=512m --conf spark.driver.cores=1 --conf spark.sql.shuffle.partitions=10 --conf spark.cleaner.periodicGC.enabled=true /opt/spark-jobs/jobs/silver_cleaning.py " ]
    restart: unless-stopped

  # ==========================================
  # Grafana - Visualization
  # ==========================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=6010
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres-timescale:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana
      - GF_DATABASE_SSL_MODE=disable
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./scripts/ensure-grafana-db.sh:/ensure-grafana-db.sh
    ports:
      - "6010:6010"
    networks:
      - stock-etl-network
    depends_on:
      postgres-timescale:
        condition: service_healthy
    command: >
      /bin/bash -c " /ensure-grafana-db.sh && /run.sh "
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6010/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redpanda-data:
  spark-delta-tables:
  spark-checkpoints:
  postgres-airflow-data:
  timescale-data:
  grafana-data:


networks:
  stock-etl-network:
    driver: bridge
